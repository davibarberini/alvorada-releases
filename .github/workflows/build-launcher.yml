name: Build launcher
run-name: Build Alvorada ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (vX.Y.Z)
        required: true
      sha256:
        description: SHA256 of the prepared build-input.zip
        required: true
permissions:
  contents: write
concurrency:
  group: launcher-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      INPUT_SHA256: ${{ inputs.sha256 }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Validate and download the draft input
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid tag' }
          if ($env:INPUT_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid digest' }
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Release must be a draft' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern build-input.zip --dir input
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash input/build-input.zip -Algorithm SHA256).Hash.ToLower() -ne $env:INPUT_SHA256) { throw 'Input checksum mismatch' }
          Expand-Archive input/build-input.zip app
          $version = (Get-Content app/package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) { throw 'Version mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
          run_install: false
      - name: Install locked dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        working-directory: app
        run: pnpm exec electron-builder --config builder.json --win nsis --x64 --publish never
      - name: Validate install and real update download
        working-directory: app
        run: pnpm exec node qa/windows-smoke.cjs
      - name: Upload installer, update metadata and evidence to the draft
        working-directory: app
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 3) { throw 'Missing update artifacts' }
          gh release upload $env:RELEASE_TAG @assets qa/windows-result.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: app/qa/*result*
          retention-days: 3
